server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Permite subidas grandes (plantillas Demo, documentos, RAG, media). Sin esto,
    # el límite por defecto de nginx (1 MB) rechaza el archivo con una página HTML
    # 413 → el frontend recibe "<html>..." y falla al parsear JSON.
    client_max_body_size 100M;

    # Los assets llevan un hash del contenido en el nombre (index-BF95yM6O.js), así que un
    # cambio SIEMPRE produce un nombre nuevo: se pueden cachear para siempre sin riesgo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # index.html NO se cachea: es quien apunta a los assets con hash. Sin esta regla
        # nginx solo mandaba ETag/Last-Modified y el navegador aplicaba caché heurística,
        # así que tras un despliegue un visitante recurrente seguía ejecutando la app
        # ANTIGUA hasta que forzaba una recarga. En incógnito funcionaba y en su navegador
        # de siempre no — un síntoma desconcertante y difícil de atribuir.
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /api/ {
        proxy_pass http://avi-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location /socket.io/ {
        proxy_pass http://avi-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }
}
